spring.application.name=EcomSphere
server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=EcomSphere

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

external.api=${EXTERNAL_API:https://dummyjson.com}
client.uri=${CLIENT_URI:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:no-reply@example.invalid}
app.base-url=${APP_BASE_URL:http://localhost:8080}

cloudinary.cloudName=${CLOUDINARY_CLOUD_NAME:walkthrough-placeholder}
cloudinary.apiKey=${CLOUDINARY_API_KEY:walkthrough-placeholder}
cloudinary.apiSecret=${CLOUDINARY_API_SECRET:walkthrough-placeholder}
cloudinary.use-mock=${USE_MOCK_CLOUDINARY:true}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

stripe.api-key=${STRIPE_API_KEY:sk_test_walkthrough_placeholder}
stripe.use-mock=${USE_MOCK_STRIPE:true}
