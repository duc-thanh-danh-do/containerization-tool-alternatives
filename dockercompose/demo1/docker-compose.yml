services:
  backend:
    build: ./backend
    container_name: express-backend
    ports:
      - "5000:5000"
      # - "127.0.0.1:5000:5000" # Bind to localhost only

  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "3000:80"
      # - "127.0.0.1:3000:80" # Bind to localhost only
    depends_on:
      - backend